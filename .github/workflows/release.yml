name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and attach the release artifacts
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # The runner holds no signing certificate, so the app is signed ad-hoc. The
      # download therefore carries no Gatekeeper approval and the release notes
      # tell the user to strip the quarantine flag — see the step below.
      - name: Build
        run: |
          xcodebuild \
            -project kiki-desktop-agent.xcodeproj \
            -scheme kiki-desktop-agent \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            build

      # ditto cannot take two sources into one archive, so the zip is built with
      # Info-ZIP from inside the staging directory: -y keeps symlinks, and the
      # zip's top level ends up as Kiki.app/ and kiki side by side.
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          stage="Kiki-$version"
          mkdir "$stage"
          cp -R build/Build/Products/Release/Kiki.app "$stage/Kiki.app"
          cp build/Build/Products/Release/kiki "$stage/kiki"
          (cd "$stage" && zip -qry "../Kiki-$version.zip" Kiki.app kiki)
          shasum -a 256 "Kiki-$version.zip" > SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cat > release-notes.md <<EOF
          ## 安装

          \`\`\`bash
          unzip Kiki-$version.zip
          xattr -dr com.apple.quarantine Kiki.app
          open Kiki.app
          \`\`\`

          1. 安装包没有公证，macOS 会拦未公证的 app——\`xattr\` 那条把隔离标记去掉；
          2. 用 \`open\` 启动，**别直接双击二进制**：从终端跑可执行文件会把「屏幕录制」授权算在终端头上；
          3. 首次启动按面板提示授权五项权限，把自己的 DeepSeek API key 粘进去；
          4. 要用 \`kiki\` 命令行：\`ln -s "\$(pwd)/kiki" /usr/local/bin/kiki\`。

          详细说明见 [README](https://github.com/${GITHUB_REPOSITORY}#readme)。
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Kiki $version" \
            --notes-file release-notes.md \
            "Kiki-$version.zip" SHA256SUMS.txt
