name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: Build and attach the release artifacts
    # macos-15 defaults to Xcode 16.4, which does not build this project; macos-26
    # defaults to Xcode 26.6, the era the project's Swift settings target.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Read the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The runner holds no signing certificate, so the app is signed ad-hoc. The
      # download therefore carries no Gatekeeper approval and the release notes
      # tell the user to strip the quarantine flag — see the step below.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project kiki-desktop-agent.xcodeproj \
            -scheme kiki-desktop-agent \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log

      # The job log needs admin rights to read; annotations do not, so a failed build
      # re-emits its first errors (or its last lines) where anyone can see them.
      - name: Report the build errors
        if: failure()
        run: |
          errors=$(grep -E "error:|The following build commands failed" build.log | head -12 || true)
          if [ -z "$errors" ]; then errors=$(tail -20 build.log 2>/dev/null || true); fi
          while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done <<< "$errors"

      # A version's number is written in three places — the tag, the app's
      # CFBundleShortVersionString and the CHANGELOG heading — and nothing else keeps
      # them in step. A disagreement fails the run before anything is packaged,
      # which costs no more than deleting the tag.
      - name: Check the tag against the app and the changelog
        env:
          version: ${{ steps.version.outputs.version }}
        run: |
          built_version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            build/Build/Products/Release/Kiki.app/Contents/Info.plist)
          if [ "$built_version" != "$version" ]; then
            echo "::error::tag v$version but the app builds as $built_version — set MARKETING_VERSION to $version first"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi

      # The app is the whole product: the `kiki` tool rides inside it at
      # `Kiki.app/Contents/Resources/kiki`, put there by the app target's own copy phase, so
      # there is no second file to install or to go stale beside it. The dmg is what a
      # person installs from; the zip is the same app for scripts and for anything that
      # would rather not mount a disk image. The Applications symlink is added after the
      # zip is written so it lands only in the dmg, on the leading edge of the drag.
      - name: Package the app as a dmg and a zip
        env:
          version: ${{ steps.version.outputs.version }}
        run: |
          stage="Kiki-$version"
          mkdir "$stage"
          cp -R build/Build/Products/Release/Kiki.app "$stage/Kiki.app"
          (cd "$stage" && zip -qry "../Kiki-$version.zip" Kiki.app)
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname "Kiki" -srcfolder "$stage" -ov -format UDZO "Kiki-$version.dmg"
          shasum -a 256 "Kiki-$version.zip" "Kiki-$version.dmg" > SHA256SUMS.txt

      # Attestations need a public repository; a private one needs GitHub Enterprise
      # Cloud for this step to succeed.
      - name: Attest the build provenance of the dmg and the zip
        uses: actions/attest@v4
        with:
          subject-path: |
            Kiki-${{ steps.version.outputs.version }}.zip
            Kiki-${{ steps.version.outputs.version }}.dmg

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          version: ${{ steps.version.outputs.version }}
        run: |
          # Re-pushing a tag whose draft release already exists would fail at `gh release
          # create`; the stale draft is replaced. A published release is never touched —
          # re-tagging one would swap artifacts people have already downloaded.
          existing_release_is_draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null || true)
          case "$existing_release_is_draft" in
            true) gh release delete "$GITHUB_REF_NAME" --yes ;;
            false)
              echo "::error::$GITHUB_REF_NAME already has a published release — bump the version instead of re-tagging"
              exit 1
              ;;
          esac

          cat > release-notes.md <<EOF
          ## 安装

          下载 **Kiki-$version.dmg**，打开，把 **Kiki.app** 拖进「应用程序」：

          \`\`\`bash
          xattr -dr com.apple.quarantine /Applications/Kiki.app
          open /Applications/Kiki.app
          \`\`\`

          不想用 dmg 就用 zip：解压后对 \`Kiki.app\` 做同样两件事。命令行工具 \`kiki\` 就在 app 里面，和 app 永远同版本——打开面板，在「命令行」卡片上点**安装命令行工具**，会弹一次系统授权（\`/usr/local/bin\` 属于 root），装好的那行变紫色。不想点按钮就手动，效果一样：

          \`\`\`bash
          ln -s /Applications/Kiki.app/Contents/Resources/kiki /usr/local/bin/kiki
          \`\`\`

          1. 安装包没有公证，macOS 会拦未公证的 app——\`xattr\` 那条把隔离标记去掉；
          2. 用 \`open\` 启动，**别直接双击二进制**：从终端跑可执行文件会把「屏幕录制」授权算在终端头上；
          3. 首次启动按面板提示授权五项权限，把自己的 DeepSeek API key 粘进去。

          这个包附有 GitHub 来源证明，可以核对它确实由本仓库的发布流程构建：

          \`\`\`bash
          gh attestation verify Kiki-$version.dmg --repo ${GITHUB_REPOSITORY}
          gh attestation verify Kiki-$version.zip --repo ${GITHUB_REPOSITORY}
          \`\`\`

          详细说明见 [README](https://github.com/${GITHUB_REPOSITORY}#readme)。

          EOF

          # The changelog is the one place a version's changes are written down; the
          # notes carry that section whole rather than a second retelling of it.
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside { print }
          ' CHANGELOG.md >> release-notes.md

          prerelease=""
          case "$version" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --draft $prerelease \
            --title "Kiki $version" \
            --notes-file release-notes.md \
            "Kiki-$version.zip" "Kiki-$version.dmg" SHA256SUMS.txt
