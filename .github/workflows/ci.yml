name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Kiki.app and kiki (${{ matrix.configuration }})
    # macos-15 defaults to Xcode 16.4, which does not build this project; macos-26
    # defaults to Xcode 26.6, the era the project's Swift settings target.
    runs-on: macos-26
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v5

      # The runner holds no signing certificate, so both targets are built ad-hoc.
      # A local build can do the same; a self-signed certificate is what keeps its
      # TCC grants across rebuilds — see README.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project kiki-desktop-agent.xcodeproj \
            -scheme kiki-desktop-agent \
            -configuration ${{ matrix.configuration }} \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            build 2>&1 | tee build.log

      # The job log needs admin rights to read; annotations do not, so a failed build
      # re-emits its first errors (or its last lines) where anyone can see them.
      - name: Report the build errors
        if: failure()
        run: |
          errors=$(grep -E "error:|The following build commands failed" build.log | head -12 || true)
          if [ -z "$errors" ]; then errors=$(tail -20 build.log 2>/dev/null || true); fi
          while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done <<< "$errors"
